<h2>Create Your Resume</h2>

<form id="resumeForm">

    <input type="text" id="name" placeholder="Full Name" required>

    <input type="email" id="email" placeholder="Email" required>

    <input type="text" id="phone" placeholder="Phone Number" required>

    <input type="text" id="education" placeholder="Education" required>

    <input type="text" id="skills" placeholder="Skills" required>

    <textarea id="experience" placeholder="Experience"></textarea>

    <textarea id="projects" placeholder="Projects"></textarea>

    <textarea id="summary" placeholder="Professional Summary"></textarea>

    <button type="submit">Save Resume</button>

</form>
